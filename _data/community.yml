# A series of mini blog-posts about outreach, mentorship, talks, service, etc.
# Listed in the order they appear here (newest first is conventional).
#
# Each entry supports:
#   title:  post title                                          (required)
#   date:   short date label                                    (optional)
#   blurb:  paragraph description (markdown allowed)            (required)
#   media:  one visual per post                                 (optional)
#             type: image | gif | video | link
#             src:  URL/path (image/gif/video) or link URL
#             alt:  alt text (image/gif)
#   link:   optional "read more" / external article URL         (optional)
# -----------------------------------------------------------------------------

